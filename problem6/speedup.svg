<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Q6 measured speed-up by process count</title>
  <desc id="desc">All four inputs start at speed-up one for one process and fall below one as process count increases.</desc>
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Q6 Measured Speed-up</text>

  <g stroke="#d8dee9" stroke-width="1">
    <line x1="90" y1="50" x2="620" y2="50"/>
    <line x1="90" y1="125" x2="620" y2="125"/>
    <line x1="90" y1="200" x2="620" y2="200"/>
    <line x1="90" y1="275" x2="620" y2="275"/>
    <line x1="90" y1="350" x2="620" y2="350"/>
  </g>
  <g stroke="#2e3440" stroke-width="1.5">
    <line x1="90" y1="50" x2="90" y2="350"/>
    <line x1="90" y1="350" x2="620" y2="350"/>
  </g>

  <g fill="#2e3440" font-family="sans-serif" font-size="12">
    <text x="78" y="354" text-anchor="end">0.00</text>
    <text x="78" y="279" text-anchor="end">0.25</text>
    <text x="78" y="204" text-anchor="end">0.50</text>
    <text x="78" y="129" text-anchor="end">0.75</text>
    <text x="78" y="54" text-anchor="end">1.00</text>
    <text x="90" y="370" text-anchor="middle">1</text>
    <text x="260" y="370" text-anchor="middle">2</text>
    <text x="430" y="370" text-anchor="middle">4</text>
    <text x="600" y="370" text-anchor="middle">8</text>
    <text x="355" y="400" text-anchor="middle" font-size="14">Processes (P)</text>
    <text x="20" y="200" text-anchor="middle" font-size="14" transform="rotate(-90 20 200)">Speed-up S(P)</text>
  </g>

  <line x1="90" y1="50" x2="620" y2="50" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="625" y="54" fill="#6b7280" font-family="sans-serif" font-size="11">no-speed-up threshold</text>

  <polyline points="90,50 260,87.5 430,333.3 600,333.2" fill="none" stroke="#5e81ac" stroke-width="3"/>
  <polyline points="90,50 260,100 430,330 600,331.8" fill="none" stroke="#a3be8c" stroke-width="3"/>
  <polyline points="90,50 260,182 430,314.1 600,332.1" fill="none" stroke="#d08770" stroke-width="3"/>
  <polyline points="90,50 260,126 430,211.3 600,223.8" fill="none" stroke="#b48ead" stroke-width="3"/>

  <g fill="#5e81ac"><circle cx="90" cy="50" r="4"/><circle cx="260" cy="87.5" r="4"/><circle cx="430" cy="333.3" r="4"/><circle cx="600" cy="333.2" r="4"/></g>
  <g fill="#a3be8c"><circle cx="90" cy="50" r="4"/><circle cx="260" cy="100" r="4"/><circle cx="430" cy="330" r="4"/><circle cx="600" cy="331.8" r="4"/></g>
  <g fill="#d08770"><circle cx="90" cy="50" r="4"/><circle cx="260" cy="182" r="4"/><circle cx="430" cy="314.1" r="4"/><circle cx="600" cy="332.1" r="4"/></g>
  <g fill="#b48ead"><circle cx="90" cy="50" r="4"/><circle cx="260" cy="126" r="4"/><circle cx="430" cy="211.3" r="4"/><circle cx="600" cy="223.8" r="4"/></g>

  <g font-family="sans-serif" font-size="12">
    <line x1="105" y1="425" x2="135" y2="425" stroke="#5e81ac" stroke-width="3"/><text x="141" y="429">Small</text>
    <line x1="235" y1="425" x2="265" y2="425" stroke="#a3be8c" stroke-width="3"/><text x="271" y="429">Medium</text>
    <line x1="375" y1="425" x2="405" y2="425" stroke="#d08770" stroke-width="3"/><text x="411" y="429">Large</text>
    <line x1="495" y1="425" x2="525" y2="425" stroke="#b48ead" stroke-width="3"/><text x="531" y="429">Very large</text>
  </g>
</svg>
